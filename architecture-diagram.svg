<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AccessBridge Architecture</text>
  
  <!-- User -->
  <rect x="50" y="80" width="140" height="60" rx="8" fill="#fff" stroke="#6b7280" stroke-width="2"/>
  <text x="120" y="115" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#374151">Slack User</text>
  
  <!-- Arrow to Slack -->
  <line x1="190" y1="110" x2="280" y2="110" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Slack -->
  <rect x="280" y="80" width="140" height="60" rx="8" fill="#4a154b" stroke="#4a154b" stroke-width="2"/>
  <text x="350" y="115" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#fff" font-weight="bold">Slack</text>
  
  <!-- Arrow to Bolt -->
  <line x1="420" y1="110" x2="520" y2="110" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- AccessBridge App -->
  <rect x="520" y="70" width="230" height="80" rx="8" fill="#fff" stroke="#2563eb" stroke-width="2"/>
  <text x="635" y="100" font-family="system-ui, sans-serif" font-size="15" text-anchor="middle" fill="#1a1a1a" font-weight="bold">AccessBridge</text>
  <text x="635" y="125" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Bolt.js App</text>
  
  <!-- Down arrow -->
  <line x1="635" y1="150" x2="635" y2="200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow)"/>
  
  <!-- Workflows -->
  <rect x="280" y="200" width="150" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="355" y="230" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1e3a8a">Simplifier</text>
  
  <rect x="450" y="200" width="150" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="525" y="230" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1e3a8a">Acronym Explainer</text>
  
  <rect x="620" y="200" width="150" height="50" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="695" y="230" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle" fill="#1e3a8a">Image/Notes</text>
  
  <!-- External services -->
  <rect x="80" y="320" width="180" height="70" rx="8" fill="#fff" stroke="#ea580c" stroke-width="2"/>
  <text x="170" y="350" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">MCP Server</text>
  <text x="170" y="375" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Accessibility KB</text>
  
  <rect x="310" y="320" width="180" height="70" rx="8" fill="#fff" stroke="#16a34a" stroke-width="2"/>
  <text x="400" y="350" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">Slack AI</text>
  <text x="400" y="375" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Text Simplification</text>
  
  <rect x="540" y="320" width="180" height="70" rx="8" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
  <text x="630" y="350" font-family="system-ui, sans-serif" font-size="14" text-anchor="middle" fill="#1a1a1a" font-weight="bold">RTS API</text>
  <text x="630" y="375" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle" fill="#4b5563">Workspace Search</text>
  
  <!-- Connections -->
  <line x1="525" y1="225" x2="260" y2="355" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="525" y1="225" x2="400" y2="320" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  <line x1="525" y1="225" x2="540" y2="355" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,5"/>
  
  <!-- Output back -->
  <line x1="170" y1="320" x2="170" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="400" y1="320" x2="400" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="630" y1="320" x2="630" y2="170" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arrow)"/>
  
  <!-- Legend -->
  <rect x="50" y="430" width="700" height="50" rx="6" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <text x="70" y="450" font-family="system-ui, sans-serif" font-size="12" fill="#374151"><tspan font-weight="bold">Required technologies:</tspan> Slack AI, MCP server integration, Real-Time Search API</text>
  <text x="70" y="470" font-family="system-ui, sans-serif" font-size="12" fill="#374151">Dashed lines = optional context; solid lines = core request flow</text>
  
  <!-- Arrow marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
